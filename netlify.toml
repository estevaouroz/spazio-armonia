[build]
  # só a pasta public/ vai pro ar; README, scripts e o código das funções ficam de fora
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Cabeçalhos de segurança em todas as páginas.
# Content-Security-Policy: lista de onde o navegador pode carregar cada coisa.
#   Ao adicionar um serviço externo novo (script, fonte, iframe...), inclua a
#   origem dele aqui, senão o navegador bloqueia.
#   O sha256 libera só o <script> inline do <head> do index.html; se esse
#   script mudar, o hash tem que ser recalculado (ver comentário no HTML).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'sha256-H2PchOcdN81+6nrqfllOAn5keMzLQGkejvNX9mpjjbQ=' https://cdn.jsdelivr.net; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: blob:; \
      connect-src 'self'; \
      frame-src https://www.google.com; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'; \
      upgrade-insecure-requests"""
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
